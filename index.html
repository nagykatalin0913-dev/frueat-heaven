<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fru’eat Heaven</title>

<style>
body{
 font-family: Arial;
 background:#f2f2f2;
 padding:15px;
}

.header{
 font-size:28px;
 font-weight:bold;
 margin-bottom:10px;
}

.card{
 background:white;
 padding:15px;
 margin:10px 0;
 border-radius:10px;
 box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

button{
 background:#2e7d32;
 color:white;
 padding:10px;
 border:none;
 border-radius:5px;
 width:100%;
 font-size:16px;
}

input{
 width:100%;
 padding:8px;
}
</style>

</head>
<body>

<div class="header">Fru’eat Heaven 🍓</div>

<div id="kinalat"></div>
<div id="termekek"></div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyOfBTcodDIxMCyrOwLGX5H_upU11Glay-4cv6jnCS5gd0aU2X_kHFTE0YOSfDtPIFKHQ/exec";

const ORDER_API = "https://script.google.com/macros/s/AKfycbx_9cJfISJNZ7SykOdI83cmrIKXYix-h9Ca8ESbXuWL6WBvPnmSdT9Xh2WIae1TiaX5tA/exec";

fetch(API)
.then(r=>r.json())
.then(data=>{

 document.getElementById("kinalat").innerHTML=`
  <div class="card">
   <b>${data.kinalat.cim}</b><br><br>
   ${data.kinalat.uzenet}<br><br>
   Határidő: ${data.kinalat.hatarido}<br>
   ${data.kinalat.atvetel}
  </div>
 `;

 let html="";

 data.termekek.forEach(t=>{
  html+=`
   <div class="card">
    <b>${t.nev}</b><br>
    ${t.ar} ${t.egyseg}<br><br>
    <button onclick="rendel('${t.nev}')">Rendelés</button>
   </div>
  `;
 });

 document.getElementById("termekek").innerHTML=html;

});

function rendel(termek){

 document.getElementById("termekek").innerHTML=`
  <div class="card">
   <b>Rendelés: ${termek}</b><br><br>

   Név:<br>
   <input id="nev"><br><br>

   Telefonszám:<br>
   <input id="tel"><br><br>

   Cím:<br>
   <input id="cim"><br><br>

   <button onclick="kuldes('${termek}')">Rendelés elküldése</button>
  </div>
 `;
}

function kuldes(termek){

 let nev = document.getElementById("nev").value;
 let tel = document.getElementById("tel").value;
 let cim = document.getElementById("cim").value;

 if(!nev || !tel || !cim){
  alert("Kérlek tölts ki minden mezőt!");
  return;
 }

 let url = ORDER_API
 + "?nev=" + encodeURIComponent(nev)
 + "&tel=" + encodeURIComponent(tel)
 + "&cim=" + encodeURIComponent(cim)
 + "&termek=" + encodeURIComponent(termek);

 fetch(url)
 .then(()=> {
  alert("Sikeres rendelés!");
  location.reload();
 })
 .catch(()=> {
  alert("Hiba történt!");
 });
}

</script>

</body>
</html>
